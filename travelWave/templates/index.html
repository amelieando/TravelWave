{% extends "base.html" %}

{% block title %}Travel Itinerary Planner - Plan Your Dream Trip{% endblock %}

{% block content %}
<div class="landing-page">
    <!-- Slideshow Background -->
    <div class="slideshow-container">
        {% for image in slideshow_images %}
            <div class="slide {% if loop.first %}active{% endif %}"
                style="background-image: url('{{ url_for('static', filename=image) }}');">
            </div>
        {% endfor %}
    </div>


    <!-- Overlay Content -->
    <div class="landing-overlay">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8 text-center">
                    <div class="hero-content">
                        <h1 class="hero-title">
                            Plan Your Dream Trip
                        </h1>
                        
                        <div class="cta-section">
                            <button class="btn btn-primary btn-lg get-started-btn">
                                Get Started
                            </button>
                            
                            <div class="loading-text">
                                <p class="dream-text">dream travel plan loading<span class="dots">
                                    <span class="dot">.</span>
                                    <span class="dot">.</span>
                                    <span class="dot">.</span>
                                </span></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Initialize slideshow
    document.addEventListener('DOMContentLoaded', function() {
        initializeSlideshow();
        initializeLoadingAnimation();
    });
</script>
{% endblock %}
