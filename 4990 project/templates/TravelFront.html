<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Itinerary Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            z-index: -1;
            opacity: 1;
            transition: opacity 3s ease-in-out;
        }

        .container {
            text-align: center;
            background: #f8efff;
            padding: 20px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #C8A2C8;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: flex-start;
            margin-bottom: 20px;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            font-size: 16px;
        }

        .checkbox-group input[type="checkbox"] {
            margin-right: 10px;
        }

        button {
            background-color: #C8A2C8;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #C8A2C8;
        }

        .result {
            margin-top: 20px;
            text-align: left;
            font-size: 16px;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #e4d4ef;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">Travel Itinerary Generator</div>

        <!-- Search Bar -->
        <input type="text" id="destination" placeholder="Where are you going?">

        <script>
            var sel = document.createElement("select");
            sel.options[0] = new Option('How many days?', 0);
            for (var i = 1; i < 101; i++) {
                sel.options[i] = new Option(i, i);
            }
            sel.setAttribute("id", "days");
            document.querySelector('.container').appendChild(sel);
        </script>

        <!-- Dropdown Menu for season -->
        <select id="season">
            <option value="" disabled selected>Select the season</option>
            <option value="winter">Winter</option>
            <option value="spring">Spring</option>
            <option value="summer">Summer</option>
            <option value="fall">Fall</option>
        </select>

        <!-- Textarea for Details -->
        <textarea id="details" placeholder="Any specific activities you want to do?"></textarea>

        <!-- Checkboxes for Trip Type -->
        <div class="checkbox-group">
            <label><input type="checkbox" value="Family Trip" class="trip-type"> Family</label>
            <label><input type="checkbox" value="21 and Over Trip" class="trip-type"> 21+</label>
            <label><input type="checkbox" value="Adventure Trip" class="trip-type"> Adventure</label>
            <label><input type="checkbox" value="Relaxation Trip" class="trip-type"> Relaxation</label>
        </div>

        <button id="generate-btn">Generate Itinerary</button>
        <div class="result" id="result"></div>
    </div>

    <script>
        const images = [
            "{{ url_for('static', filename='imgs/img1.jpg') }}",
            "{{ url_for('static', filename='imgs/img2.jpg') }}",
            "{{ url_for('static', filename='imgs/img3.jpg') }}",
            "{{ url_for('static', filename='imgs/img4.jpg') }}",
            "{{ url_for('static', filename='imgs/img5.jpg') }}",
            "{{ url_for('static', filename='imgs/img6.jpg') }}",
            "{{ url_for('static', filename='imgs/img7.jpg') }}",
            "{{ url_for('static', filename='imgs/img8.jpg') }}",
            "{{ url_for('static', filename='imgs/img9.jpg') }}",
            "{{ url_for('static', filename='imgs/img10.jpg') }}",
            "{{ url_for('static', filename='imgs/img11.jpg') }}",
            "{{ url_for('static', filename='imgs/img12.jpg') }}",
            "{{ url_for('static', filename='imgs/img13.jpg') }}",
            "{{ url_for('static', filename='imgs/img14.jpg') }}",
            "{{ url_for('static', filename='imgs/img15.jpg') }}",
            "{{ url_for('static', filename='imgs/img16.jpg') }}",
            "{{ url_for('static', filename='imgs/img17.jpg') }}",
            "{{ url_for('static', filename='imgs/img18.jpg') }}",
            "{{ url_for('static', filename='imgs/img19.jpg') }}",
            "{{ url_for('static', filename='imgs/img20.jpg') }}"
        ];

        let currentIndex = 0;
        const backgroundElement = document.createElement('div');
        backgroundElement.classList.add('background');
        backgroundElement.style.backgroundImage = `url(${images[currentIndex]})`;
        document.body.appendChild(backgroundElement);

        function changeBackground() {
            backgroundElement.style.opacity = '0';

            setTimeout(() => {
                currentIndex = (currentIndex + 1) % images.length;
                backgroundElement.style.backgroundImage = `url(${images[currentIndex]})`;
                backgroundElement.style.opacity = '1';
            }, 2000); // Match the transition duration
        }

        // Preload all images
        let loadedImages = 0;
        images.forEach(src => {
            const img = new Image();
            img.src = src;
            img.onload = () => {
                loadedImages++;
                if (loadedImages === images.length) {
                    console.log('All images preloaded successfully.');
                    setInterval(changeBackground, 5000); // Start animation after preloading
                }
            };
            img.onerror = () => {
                console.error('Failed to load image:', src);
            };
        });
    </script>

    <script>
        document.getElementById('generate-btn').addEventListener('click', async () => {
            const destination = document.getElementById('destination').value;
            const season = document.getElementById('season').value;
            const details = document.getElementById('details').value;
            const days = document.getElementById('days').value;

            const tripTypes = Array.from(document.querySelectorAll('.trip-type:checked'))
                .map(checkbox => checkbox.value)
                .join(', ');

            const resultDiv = document.getElementById('result');

            if (!destination || !season) {
                resultDiv.textContent = 'Please fill out all required fields: destination and season.';
                return;
            }

            const input = `
                Destination: ${destination}
                Season: ${season}
                Days: ${days}
                Details: ${details || 'No additional details'}
                Trip Types: ${tripTypes || 'No specific trip types'}
            `;

            resultDiv.textContent = 'Generating itinerary...';

            try {
                const response = await fetch('/generate-itinerary', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ vacay_description: input })
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.textContent = data.travel_prompt;
                } else {
                    resultDiv.textContent = data.error || 'An error occurred.';
                }
            } catch (error) {
                resultDiv.textContent = 'Failed to connect to the server.';
            }
        });
    </script>
</body>

</html>
